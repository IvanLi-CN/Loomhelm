services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOOMHELM_POSTGRES_DB:-loomhelm}
      POSTGRES_USER: ${LOOMHELM_POSTGRES_USER:-loomhelm}
      POSTGRES_PASSWORD: ${LOOMHELM_POSTGRES_PASSWORD:-loomhelm_dev_only}
    ports:
      - "127.0.0.1:${LOOMHELM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - loomhelm-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loomhelm-dev-postgres:
