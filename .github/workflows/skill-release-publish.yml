name: Skill Runtime Release

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number carrying the release decision
        required: true
        type: string
      merge_sha:
        description: Exact merge commit SHA from the protected main branch
        required: true
        type: string
      publish:
        description: Publish and promote the verified package after candidate validation
        required: true
        default: false
        type: boolean
      stable:
        description: Explicitly move the stable dist-tag after exact, compat, and latest verification
        required: true
        default: false
        type: boolean
      resume_run_id:
        description: Previous workflow run whose candidate and receipt must be reconciled without rebuilding or republishing
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: loomhelm-skill-runtime-release-${{ inputs.merge_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify merged Skill release candidate
    runs-on: ubuntu-24.04
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
      version: ${{ steps.gate.outputs.version }}
      compatibility_line: ${{ steps.gate.outputs.compatibility_line }}
      artifact_name: ${{ steps.artifact_build.outputs.artifact_name || steps.artifact_resume.outputs.artifact_name }}
    steps:
      - name: Check out the exact merge SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Verify protected merge receipt
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          test "$MERGE_SHA" = "$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/skill-release-pr.json"
          python3 - "$RUNNER_TEMP/skill-release-pr.json" "$MERGE_SHA" "$RUNNER_TEMP/skill-release-event.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import subprocess
          import sys

          pr_path, merge_sha, event_path, output_path = sys.argv[1:]
          pr = json.loads(open(pr_path, encoding="utf-8").read())
          if pr.get("state") != "closed" or not pr.get("merged_at"):
              raise SystemExit("release requires a merged pull request")
          if pr.get("merge_commit_sha") != merge_sha or pr.get("base", {}).get("ref") != "main":
              raise SystemExit("pull request merge receipt does not match the requested main SHA")
          if pr.get("draft") is True:
              raise SystemExit("draft pull requests cannot be released")
          parents = subprocess.check_output(
              ["git", "show", "-s", "--format=%P", merge_sha], text=True
          ).split()
          if not parents:
              raise SystemExit("merge SHA has no protected base parent")
          json.dump({"pull_request": pr}, open(event_path, "w", encoding="utf-8"))
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"base_sha={parents[0]}\n")
          PY
      - name: Verify exact npm version state
        id: registry
        env:
          PACKAGE_NAME: '@loomhelm/multi-task-flow'
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("clients/typescript/package.json", encoding="utf-8"))["version"])')"
          metadata="$RUNNER_TEMP/skill-release-registry-version.json"
          error="$RUNNER_TEMP/skill-release-registry-version.err"
          if npm view "$PACKAGE_NAME@$version" version --json > "$metadata" 2> "$error"; then
            echo 'registry_version_missing=false' >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|No match found' "$error"; then
            echo 'registry_version_missing=true' >> "$GITHUB_OUTPUT"
          else
            cat "$error" >&2
            exit 1
          fi
      - name: Revalidate release label, version, and projection
        id: gate
        env:
          BASE_SHA: ${{ steps.merge.outputs.base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          REGISTRY_VERSION_MISSING: ${{ steps.registry.outputs.registry_version_missing }}
        run: |
          set -euo pipefail
          gate_args=(
            gate
            --repo-root . \
            --base "$BASE_SHA" \
            --head "$MERGE_SHA" \
            --event-path "$RUNNER_TEMP/skill-release-event.json"
          )
          if [ "$REGISTRY_VERSION_MISSING" = true ]; then
            gate_args+=(--initial-publication --registry-version-missing)
          else
            if python3 tools/skill-release/release.py gate --help | grep -q -- '--reconcile-existing'; then
              gate_args+=(--initial-publication --reconcile-existing)
            else
              # The protected candidate merge predates reconciliation support.
              # Continue through the legacy initial-publication gate; the publish
              # job must still reconcile exact package identity and registry digest.
              gate_args+=(--initial-publication --registry-version-missing)
            fi
          fi
          python3 tools/skill-release/release.py "${gate_args[@]}" > "$RUNNER_TEMP/skill-release-gate.json"
          python3 - "$RUNNER_TEMP/skill-release-gate.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          result = json.loads(open(sys.argv[1], encoding="utf-8").read())
          if not result.get("relevant"):
              raise SystemExit("the merged PR is not in the Skill release content boundary")
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"decision={result['decision']}\n")
              output.write(f"version={result['head_version'] or ''}\n")
              output.write(f"compatibility_line={result['compatibility_line'] or ''}\n")
              output.write(f"reason={result.get('reason') or ''}\n")
          PY
      - name: Verify immutable tag precondition
        if: steps.gate.outputs.decision == 'release:skill' || steps.gate.outputs.decision == 'release:skill-initial-publication'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: >-
          python3 tools/skill-release/release.py verify-tag
          --repository "$GITHUB_REPOSITORY"
          --tag "multi-task-flow-v$VERSION"
          --sha "$MERGE_SHA"
          --allow-missing
      - name: Build and validate one candidate tarball
        id: artifact_build
        if: (steps.gate.outputs.decision == 'release:skill' || steps.gate.outputs.decision == 'release:skill-initial-publication') && inputs.resume_run_id == ''
        env:
          MERGE_SHA: ${{ inputs.merge_sha }}
          VERSION: ${{ steps.gate.outputs.version }}
          COMPATIBILITY_LINE: ${{ steps.gate.outputs.compatibility_line }}
        run: |
          set -euo pipefail
          bun install --cwd skills --frozen-lockfile --ignore-scripts --backend=copy
          bun install --cwd skills/multi-task-flow-runtime --frozen-lockfile
          bun install --cwd clients/typescript --frozen-lockfile
          bun run --cwd skills/multi-task-flow-runtime build
          version_tag="multi-task-flow-v$VERSION"
          draft_dir="$RUNNER_TEMP/skill-release-draft"
          final_dir="$RUNNER_TEMP/skill-release-final"
          rm -rf "$draft_dir" "$final_dir"
          mkdir -p "$draft_dir" "$final_dir"
          export LOOMHELM_REQUIRE_MERGE_SHA=1
          export LOOMHELM_MERGE_SHA="$MERGE_SHA"
          export LOOMHELM_GIT_TAG="$version_tag"
          export LOOMHELM_TARBALL_DIGEST=
          set_package_metadata() {
            python3 - "$1" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          package = json.load(open(path, encoding="utf-8"))
          package["repository"] = {"type": "git", "url": "https://github.com/IvanLi-CN/Loomhelm"}
          with open(path, "w", encoding="utf-8") as output:
              json.dump(package, output, indent=2)
              output.write("\n")
          PY
          }
          (cd clients/typescript && bun --no-install run build)
          set_package_metadata clients/typescript/package.json
          set_package_metadata clients/typescript/toolkit/package.json
          (cd clients/typescript && bun pm pack --destination "$draft_dir" --ignore-scripts --quiet)
          mapfile -t drafts < <(find "$draft_dir" -type f -name '*.tgz' -print)
          test "${#drafts[@]}" -eq 1
          digest="$(python3 tools/skill-release/release.py tarball-digest "${drafts[0]}")"
          export LOOMHELM_TARBALL_DIGEST="$digest"
          git checkout -- clients/typescript/package.json
          (cd clients/typescript && bun --no-install run build)
          set_package_metadata clients/typescript/package.json
          set_package_metadata clients/typescript/toolkit/package.json
          (cd clients/typescript && bun pm pack --destination "$final_dir" --ignore-scripts --quiet)
          mapfile -t finals < <(find "$final_dir" -type f -name '*.tgz' -print)
          test "${#finals[@]}" -eq 1
          final_digest="$(python3 tools/skill-release/release.py tarball-digest "${finals[0]}")"
          printf 'draft_tarball_digest=%s final_tarball_digest=%s\n' "$digest" "$final_digest"
          python3 - "${drafts[0]}" "${finals[0]}" <<'PY'
          import sys
          import tarfile
          import hashlib

          def files(path):
              with tarfile.open(path, 'r:gz') as archive:
                  return {
                      member.name.removeprefix('package/'):
                      hashlib.sha256(archive.extractfile(member).read()).hexdigest()
                      for member in archive.getmembers()
                      if member.isfile() and member.name != 'package/toolkit/artifact-manifest.json'
                  }

          draft, final = (files(path) for path in sys.argv[1:])
          differences = sorted(set(draft) | set(final))
          differences = [path for path in differences if draft.get(path) != final.get(path)]
          print('canonical_file_differences=' + repr(differences[:100]))
          if differences:
              raise SystemExit('draft and final canonical tarball files differ')
          PY
          python3 tools/skill-release/release.py validate-tarball "${finals[0]}" \
            --version "$VERSION" \
            --merge-sha "$MERGE_SHA" \
            --compatibility-line "$COMPATIBILITY_LINE"
          cp "${finals[0]}" "$RUNNER_TEMP/skill-package.tgz"
          python3 - "${finals[0]}" "$RUNNER_TEMP/skill-release-validation.json" "$RUNNER_TEMP/release-identity.json" <<'PY'
          import hashlib
          import json
          import sys

          tarball, validation_path, identity_path = sys.argv[1:]
          validation = json.loads(__import__('subprocess').check_output([
              'python3', 'tools/skill-release/release.py', 'validate-tarball', tarball,
              '--version', __import__('os').environ['VERSION'],
              '--merge-sha', __import__('os').environ['MERGE_SHA'],
              '--compatibility-line', __import__('os').environ['COMPATIBILITY_LINE'],
          ], text=True))
          open(validation_path, 'w', encoding='utf-8').write(json.dumps(validation, sort_keys=True) + '\n')
          record = {
              'state': 'candidate-validated',
              'published': False,
              'completed': False,
              'packageName': validation['packageName'],
              'packageVersion': validation['packageVersion'],
              'compatibilityLine': validation['compatibilityLine'],
              'mergeSha': validation['mergeSha'],
              'buildId': validation['buildId'],
              'tag': validation['gitTag'],
              'canonicalDigest': validation['tarballDigest'],
              'canonicalDigestAlgorithm': validation['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': validation['canonicalDigestVerified'],
              'rawIntegrity': validation['rawIntegrity'],
              'registryObservation': 'not-observed',
              'distTags': {},
          }
          record['id'] = hashlib.sha256(json.dumps(record, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          open(identity_path, 'w', encoding='utf-8').write(json.dumps(record, indent=2, sort_keys=True) + '\n')
          receipt = {
              'schemaVersion': 1,
              'state': 'candidate-validated',
              'published': False,
              'completed': False,
              'packageName': validation['packageName'],
              'packageVersion': validation['packageVersion'],
              'compatibilityLine': validation['compatibilityLine'],
              'mergeSha': validation['mergeSha'],
              'buildId': validation['buildId'],
              'tag': validation['gitTag'],
              'canonicalDigest': validation['tarballDigest'],
              'canonicalDigestAlgorithm': validation['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': validation['canonicalDigestVerified'],
              'rawIntegrity': validation['rawIntegrity'],
              'publishOutcome': 'not-attempted',
              'registryObservation': {'state': 'not-observed'},
              'distTags': {},
          }
          with open(validation_path.replace('skill-release-validation.json', 'release-receipt.json'), 'w', encoding='utf-8') as output:
              json.dump(receipt, output, indent=2, sort_keys=True)
              output.write('\n')
          PY
          printf 'artifact_name=skill-release-%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore and validate one existing candidate tarball
        id: artifact_resume
        if: (steps.gate.outputs.decision == 'release:skill' || steps.gate.outputs.decision == 'release:skill-initial-publication') && inputs.resume_run_id != ''
        env:
          MERGE_SHA: ${{ inputs.merge_sha }}
          VERSION: ${{ steps.gate.outputs.version }}
          COMPATIBILITY_LINE: ${{ steps.gate.outputs.compatibility_line }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$RESUME_RUN_ID" != "$GITHUB_RUN_ID"
          resume_dir="$RUNNER_TEMP/resumed-skill-release"
          receipt_dir="$RUNNER_TEMP/resumed-skill-release-receipt"
          rm -rf "$resume_dir" "$receipt_dir"
          gh run download "$RESUME_RUN_ID" --name "skill-release-$VERSION" --dir "$resume_dir"
          tarball="$(find "$resume_dir" -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          python3 tools/skill-release/release.py validate-tarball "$tarball" --version "$VERSION" --merge-sha "$MERGE_SHA" --compatibility-line "$COMPATIBILITY_LINE" > "$RUNNER_TEMP/skill-release-validation.json"
          cp "$tarball" "$RUNNER_TEMP/skill-package.tgz"
          identity="$(find "$resume_dir" -type f -name 'release-identity.json' -print -quit)"
          if [ -n "$identity" ]; then cp "$identity" "$RUNNER_TEMP/release-identity.json"; else echo 'resumed candidate has no release identity receipt' >&2; exit 1; fi
          if ! gh run download "$RESUME_RUN_ID" --pattern "skill-release-receipt-${MERGE_SHA}-*" --dir "$receipt_dir"; then
            echo 'resumed candidate has no downloadable release receipt' >&2
            exit 1
          fi
          prior_receipt="$(find "$receipt_dir" -type f -name 'skill-release-receipt.json' -print -quit)"
          test -n "$prior_receipt"
          cp "$prior_receipt" "$RUNNER_TEMP/release-receipt.json"
          python3 - "$RUNNER_TEMP/skill-release-validation.json" "$RUNNER_TEMP/release-receipt.json" <<'PY'
          import json
          import sys

          validation = json.load(open(sys.argv[1], encoding='utf-8'))
          receipt = json.load(open(sys.argv[2], encoding='utf-8'))
          expected = {
              'packageName': validation['packageName'],
              'packageVersion': validation['packageVersion'],
              'compatibilityLine': validation['compatibilityLine'],
              'mergeSha': validation['mergeSha'],
              'buildId': validation['buildId'],
              'tag': validation['gitTag'],
              'canonicalDigest': validation['tarballDigest'],
              'canonicalDigestAlgorithm': validation['canonicalDigestAlgorithm'],
              'rawIntegrity': validation['rawIntegrity'],
          }
          if receipt.get('schemaVersion') != 1 or any(receipt.get(key) != value for key, value in expected.items()):
              raise SystemExit('resumed release receipt does not match the verified candidate')
          if not isinstance(receipt.get('distTags'), dict):
              raise SystemExit('resumed release receipt has invalid dist-tag state')
          PY
          printf 'artifact_name=skill-release-%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload the verified candidate tarball
        if: steps.gate.outputs.decision == 'release:skill' || steps.gate.outputs.decision == 'release:skill-initial-publication'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-release-${{ steps.gate.outputs.version }}
          path: |
            ${{ runner.temp }}/skill-package.tgz
            ${{ runner.temp }}/release-identity.json
            ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload release identity for failure reconciliation
        if: always() && (steps.gate.outputs.decision == 'release:skill' || steps.gate.outputs.decision == 'release:skill-initial-publication')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-identity
          path: ${{ runner.temp }}/release-identity.json
          if-no-files-found: ignore
          retention-days: 30

  record-skip:
    name: Record explicit Skill release skip
    needs: verify
    if: needs.verify.outputs.decision == 'release:skip'
    runs-on: ubuntu-24.04
    steps:
      - name: Write skip receipt
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMPATIBILITY_LINE: ${{ needs.verify.outputs.compatibility_line }}
          REASON: ${{ needs.verify.outputs.reason }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/skill-release-skip.json" <<'PY'
          import json
          import os
          import sys

          json.dump(
              {
                  "decision": "release:skip",
                  "pr_number": os.environ["PR_NUMBER"],
                  "merge_sha": os.environ["MERGE_SHA"],
                  "package_version": os.environ["VERSION"],
                  "compatibility_line": os.environ["COMPATIBILITY_LINE"],
                  "reason": os.environ["REASON"],
              },
              open(sys.argv[1], "w", encoding="utf-8"),
              indent=2,
          )
          PY
      - name: Upload skip receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-release-skip-${{ inputs.merge_sha }}
          path: ${{ runner.temp }}/skill-release-skip.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish and promote verified Skill package
    needs: verify
    if: inputs.publish == true && (needs.verify.outputs.decision == 'release:skill' || needs.verify.outputs.decision == 'release:skill-initial-publication')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_NAME: '@loomhelm/multi-task-flow'
      MERGE_SHA: ${{ inputs.merge_sha }}
      VERSION: ${{ needs.verify.outputs.version }}
      COMPATIBILITY_LINE: ${{ needs.verify.outputs.compatibility_line }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - name: Check out the exact merge SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified candidate tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skill-release-${{ needs.verify.outputs.version }}
          path: ${{ runner.temp }}/skill-release
      - name: Set up Node.js and npm Trusted Publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports OIDC dist-tags
        run: npm install --global npm@11.21.0
      - name: Publish exact package and reconcile registry identity
        id: publish_registry
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/skill-release/skill-package.tgz"
          test -f "$tarball"
          validation="$RUNNER_TEMP/skill-release-validation.json"
          python3 tools/skill-release/release.py validate-tarball "$tarball" \
            --version "$VERSION" \
            --merge-sha "$MERGE_SHA" \
            --compatibility-line "$COMPATIBILITY_LINE" > "$validation"
          receipt="$RUNNER_TEMP/skill-release-receipt.json"
          prior_receipt="$(find "$RUNNER_TEMP/skill-release" -type f -name 'release-receipt.json' -print -quit || true)"
          if [ -n "$prior_receipt" ]; then
            cp "$prior_receipt" "$receipt"
            python3 - "$validation" "$receipt" <<'PY'
          import json
          import sys

          validation = json.load(open(sys.argv[1], encoding='utf-8'))
          receipt = json.load(open(sys.argv[2], encoding='utf-8'))
          expected = {
              'packageName': validation['packageName'],
              'packageVersion': validation['packageVersion'],
              'compatibilityLine': validation['compatibilityLine'],
              'mergeSha': validation['mergeSha'],
              'buildId': validation['buildId'],
              'tag': validation['gitTag'],
              'canonicalDigest': validation['tarballDigest'],
              'canonicalDigestAlgorithm': validation['canonicalDigestAlgorithm'],
              'rawIntegrity': validation['rawIntegrity'],
          }
          if receipt.get('schemaVersion') != 1 or any(receipt.get(key) != value for key, value in expected.items()):
              raise SystemExit('candidate receipt does not match the verified tarball')
          if not isinstance(receipt.get('distTags'), dict):
              raise SystemExit('candidate receipt has invalid dist-tag state')
          PY
          elif [ -n "$RESUME_RUN_ID" ]; then
            echo 'resume_run_id requires a release receipt in the candidate artifact' >&2
            exit 1
          else
            python3 - "$validation" "$receipt" <<'PY'
          import json
          import sys

          validation_path, receipt_path = sys.argv[1:]
          validation = json.load(open(validation_path, encoding='utf-8'))
          receipt = {
              'schemaVersion': 1,
              'state': 'candidate-validated',
              'published': False,
              'completed': False,
              'packageName': validation['packageName'],
              'packageVersion': validation['packageVersion'],
              'compatibilityLine': validation['compatibilityLine'],
              'mergeSha': validation['mergeSha'],
              'buildId': validation['buildId'],
              'tag': validation['gitTag'],
              'canonicalDigest': validation['tarballDigest'],
              'canonicalDigestAlgorithm': validation['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': validation['canonicalDigestVerified'],
              'rawIntegrity': validation['rawIntegrity'],
              'publishOutcome': 'not-attempted',
              'registryObservation': {'state': 'not-observed'},
              'distTags': {},
          }
          json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(receipt_path, 'a', encoding='utf-8').write('\n')
          PY
          fi
          update_receipt() {
            local state="$1"
            local published="$2"
            local completed="$3"
            local observation="$4"
            STATE="$state" PUBLISHED="$published" COMPLETED="$completed" OBSERVATION="$observation" RECEIPT="$receipt" python3 - <<'PY'
          import json
          import os

          path = os.environ['RECEIPT']
          value = json.load(open(path, encoding='utf-8'))
          value['state'] = os.environ['STATE']
          value['published'] = os.environ['PUBLISHED'] == 'true'
          value['completed'] = os.environ['COMPLETED'] == 'true'
          if os.environ['OBSERVATION'] in ('submitted', 'known-409', 'timeout', 'unknown', 'resume-reconcile'):
              value['publishOutcome'] = os.environ['OBSERVATION']
          value['registryObservation'] = {'state': os.environ['OBSERVATION']}
          json.dump(value, open(path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(path, 'a', encoding='utf-8').write('\n')
          PY
          }
          exact_metadata="$RUNNER_TEMP/skill-release-exact.json"
          exact_error="$RUNNER_TEMP/skill-release-exact.err"
          package_versions="$RUNNER_TEMP/skill-release-package-versions.json"
          package_error="$RUNNER_TEMP/skill-release-package.err"
          observe_exact() {
            local phase="$1"
            rm -f "$exact_metadata" "$exact_error" "$package_versions" "$package_error"
            if npm view "$PACKAGE_NAME@$VERSION" --json > "$exact_metadata" 2> "$exact_error"; then
              echo exact-visible
              return 0
            fi
            if ! grep -Eiq 'E404|404|no match found|not found' "$exact_error"; then
              echo registry-error
              return 0
            fi
            if npm view "$PACKAGE_NAME" versions --json > "$package_versions" 2> "$package_error"; then
              if [ "$phase" = preflight ]; then echo exact-404; else echo processing; fi
              return 0
            fi
            if grep -Eiq 'E404|404|no match found|not found' "$package_error"; then
              echo absent
              return 0
            fi
            echo registry-error
          }
          initial_state="$(observe_exact preflight)"
          if [ "$VERSION" = '0.2.7' ] && [ "$initial_state" != exact-visible ]; then
            case "$initial_state" in
              registry-error)
                update_receipt registry-error false false registry-error
                echo 'registry preflight failed for legacy 0.2.7; no npm write was attempted' >&2
                ;;
              *)
                update_receipt legacy-version-absent false false legacy-version-absent
                echo '0.2.7 is legacy read-only reconciliation; it must never be uploaded again' >&2
                ;;
            esac
            exit 1
          fi
          case "$initial_state" in
            exact-visible)
              ;;
            exact-404|absent)
              if [ -n "$RESUME_RUN_ID" ]; then
                update_receipt resume-reconcile false false exact-404
              else
                update_receipt exact-404 false false exact-404
                set +e
                timeout --signal=TERM 180s npm publish "$tarball" --access public --tag "$COMPATIBILITY_LINE" > "$RUNNER_TEMP/skill-release-publish.out" 2> "$RUNNER_TEMP/skill-release-publish.err"
                publish_status=$?
                set -e
                if [ "$publish_status" -eq 0 ]; then
                  update_receipt publish-submitted false false submitted
                elif grep -Eiq 'E409|cannot publish over|cannot overwrite|previously published' "$RUNNER_TEMP/skill-release-publish.out" "$RUNNER_TEMP/skill-release-publish.err"; then
                  update_receipt known-409 false false known-409
                elif [ "$publish_status" -eq 124 ]; then
                  update_receipt publish-timeout false false timeout
                else
                  update_receipt publish-unknown false false unknown
                fi
              fi
              ;;
            registry-error)
              update_receipt registry-error false false registry-error
              echo 'registry preflight failed; no npm write was attempted' >&2
              exit 1
              ;;
            *)
              update_receipt registry-error false false registry-error
              echo "unexpected registry preflight state: $initial_state" >&2
              exit 1
              ;;
          esac
          reconcile_state=
          for delay in 0 2 4 8 16 32; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            reconcile_state="$(observe_exact reconcile)"
            case "$reconcile_state" in
              exact-visible) break ;;
              processing) update_receipt processing false false processing ;;
              absent) update_receipt absent-after-submit false false absent-after-submit ;;
              registry-error)
                update_receipt registry-error false false registry-error
                echo 'registry reconciliation failed; do not retry npm publish' >&2
                exit 1
                ;;
              *)
                update_receipt registry-error false false registry-error
                echo "unexpected registry reconciliation state: $reconcile_state" >&2
                exit 1
                ;;
            esac
          done
          if [ "$reconcile_state" != exact-visible ]; then
            update_receipt processing-timeout false false processing-timeout
            echo "registry did not expose the exact version after bounded reconciliation; resume from this receipt" >&2
            exit 1
          fi
          if ! registry_url="$(python3 -c 'import json, os, sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value.get("version") == os.environ["VERSION"], "registry version does not match the release candidate"; dist=value.get("dist") or {}; url=dist.get("tarball"); assert url, "registry metadata has no tarball URL"; print(url)' "$exact_metadata")"; then
            update_receipt registry-error false false registry-error
            echo 'registry exact metadata was not usable; no tarball download or tag promotion was attempted' >&2
            exit 1
          fi
          downloaded="$RUNNER_TEMP/skill-release-registry.tgz"
          if ! curl --fail --silent --show-error --location "$registry_url" -o "$downloaded"; then
            update_receipt registry-error false false registry-error
            echo 'registry tarball download failed; no tag promotion was attempted' >&2
            exit 1
          fi
          registry_validation="$RUNNER_TEMP/skill-release-registry-validation.json"
          registry_validation_error="$RUNNER_TEMP/skill-release-registry-validation.err"
          registry_validation_args=(--version "$VERSION" --compatibility-line "$COMPATIBILITY_LINE")
          if [ "$VERSION" != '0.2.7' ]; then
            registry_validation_args+=(--merge-sha "$MERGE_SHA")
          fi
          set +e
          python3 tools/skill-release/release.py validate-tarball "$downloaded" "${registry_validation_args[@]}" > "$registry_validation" 2> "$registry_validation_error"
          registry_validation_status=$?
          set -e
          registry_raw_integrity="$(python3 tools/skill-release/release.py tarball-integrity "$downloaded")"
          if [ "$registry_validation_status" -ne 0 ]; then
            python3 - "$receipt" "$exact_metadata" "$registry_raw_integrity" <<'PY'
          import json
          import sys

          receipt_path, metadata_path, raw_integrity = sys.argv[1:]
          metadata = json.load(open(metadata_path, encoding='utf-8'))
          receipt = json.load(open(receipt_path, encoding='utf-8'))
          receipt['state'] = 'identity-mismatch'
          receipt['published'] = False
          receipt['completed'] = False
          receipt['registryObservation'] = {
              'state': 'identity-mismatch',
              'packageName': metadata.get('name'),
              'version': metadata.get('version'),
              'distIntegrity': (metadata.get('dist') or {}).get('integrity'),
              'rawIntegrity': raw_integrity,
              'reason': 'registry tarball failed artifact identity validation',
          }
          json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(receipt_path, 'a', encoding='utf-8').write('\n')
          PY
            cat "$registry_validation_error" >&2
            exit 1
          fi
          if [ "$VERSION" = '0.2.7' ]; then
            python3 - "$registry_validation" "$exact_metadata" "$receipt" <<'PY'
          import json
          import sys

          registry_path, metadata_path, receipt_path = sys.argv[1:]
          registry = json.load(open(registry_path, encoding='utf-8'))
          metadata = json.load(open(metadata_path, encoding='utf-8'))
          receipt = json.load(open(receipt_path, encoding='utf-8'))
          observation = {
              'state': 'legacy-exact-visible',
              'legacy': True,
              'packageName': registry['packageName'],
              'version': metadata.get('version'),
              'compatibilityLine': registry['compatibilityLine'],
              'mergeSha': registry['mergeSha'],
              'buildId': registry['buildId'],
              'tag': registry['gitTag'],
              'distIntegrity': (metadata.get('dist') or {}).get('integrity'),
              'rawIntegrity': registry['rawIntegrity'],
              'canonicalDigest': registry['tarballDigest'],
              'canonicalDigestAlgorithm': registry['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': registry['canonicalDigestVerified'],
              'publishOutcome': 'read-only-reconciliation',
          }
          if observation['distIntegrity'] != observation['rawIntegrity']:
              observation['state'] = 'identity-mismatch'
              observation['mismatch'] = 'registry metadata integrity differs from downloaded tarball'
              receipt['state'] = 'identity-mismatch'
              receipt['published'] = False
              receipt['completed'] = False
              receipt['registryObservation'] = observation
              json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
              open(receipt_path, 'a', encoding='utf-8').write('\n')
              raise SystemExit(observation['mismatch'])
          receipt['state'] = 'legacy-reconciled'
          receipt['published'] = False
          receipt['completed'] = False
          receipt['publishOutcome'] = 'read-only-reconciliation'
          receipt['registryObservation'] = observation
          json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(receipt_path, 'a', encoding='utf-8').write('\n')
          PY
            printf 'registry_state=legacy-exact-visible\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$validation" "$registry_validation" "$exact_metadata" "$receipt" <<'PY'
          import json
          import sys

          candidate_path, registry_path, metadata_path, receipt_path = sys.argv[1:]
          candidate = json.load(open(candidate_path, encoding='utf-8'))
          registry = json.load(open(registry_path, encoding='utf-8'))
          metadata = json.load(open(metadata_path, encoding='utf-8'))
          receipt = json.load(open(receipt_path, encoding='utf-8'))
          observation = {
              'state': 'exact-visible',
              'packageName': registry['packageName'],
              'version': metadata.get('version'),
              'compatibilityLine': registry['compatibilityLine'],
              'mergeSha': registry['mergeSha'],
              'buildId': registry['buildId'],
              'tag': registry['gitTag'],
              'distIntegrity': (metadata.get('dist') or {}).get('integrity'),
              'rawIntegrity': registry['rawIntegrity'],
              'canonicalDigest': registry['tarballDigest'],
              'canonicalDigestAlgorithm': registry['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': registry['canonicalDigestVerified'],
              'publishOutcome': receipt.get('publishOutcome', 'not-attempted'),
          }
          receipt['registryObservation'] = observation
          def mismatch(message):
              observation['state'] = 'identity-mismatch'
              observation['mismatch'] = message
              receipt['state'] = 'identity-mismatch'
              receipt['published'] = False
              receipt['completed'] = False
              json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
              open(receipt_path, 'a', encoding='utf-8').write('\n')
              raise SystemExit(message)

          for field in ('packageName', 'packageVersion', 'compatibilityLine', 'mergeSha', 'buildId', 'gitTag'):
              if candidate[field] != registry[field]:
                  mismatch(f'registry identity mismatch: {field}')
          if candidate['rawIntegrity'] != registry['rawIntegrity']:
              mismatch('registry raw integrity differs from the verified candidate')
          if (metadata.get('dist') or {}).get('integrity') != registry['rawIntegrity']:
              mismatch('registry metadata integrity differs from downloaded tarball')
          if registry['canonicalDigestVerified'] and (candidate['tarballDigest'] != registry['tarballDigest'] or registry['canonicalDigestAlgorithm'] != candidate['canonicalDigestAlgorithm']):
              mismatch('registry canonical digest differs from the verified candidate')
          receipt['state'] = 'published'
          receipt['published'] = True
          receipt['registryObservation'] = {
              'state': 'exact-visible',
              'version': metadata.get('version'),
              'distIntegrity': (metadata.get('dist') or {}).get('integrity'),
              'rawIntegrity': registry['rawIntegrity'],
              'canonicalDigest': registry['tarballDigest'],
              'canonicalDigestAlgorithm': registry['canonicalDigestAlgorithm'],
              'canonicalDigestVerified': registry['canonicalDigestVerified'],
              'publishOutcome': receipt.get('publishOutcome', 'not-attempted'),
          }
          json.dump(receipt, open(receipt_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(receipt_path, 'a', encoding='utf-8').write('\n')
          PY
          printf 'registry_state=exact-visible\n' >> "$GITHUB_OUTPUT"
          printf 'registry_state=exact-visible\n'
      - name: Create or reconcile immutable release tag after exact identity
        if: success() && steps.publish_registry.outputs.registry_state != 'legacy-exact-visible'
        run: >-
          python3 tools/skill-release/release.py verify-tag
          --repository "$GITHUB_REPOSITORY"
          --tag "multi-task-flow-v$VERSION"
          --sha "$MERGE_SHA"
          --create
      - name: Promote compatibility and latest dist-tags monotonically
        if: success() && steps.publish_registry.outputs.registry_state != 'legacy-exact-visible'
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/skill-release-receipt.json"
          test -f "$receipt"
          update_tag_receipt() {
            local tag="$1"
            local value="$2"
            local state="$3"
            TAG="$tag" VALUE="$value" STATE="$state" RECEIPT="$receipt" python3 - <<'PY'
          import json
          import os

          path = os.environ['RECEIPT']
          value = json.load(open(path, encoding='utf-8'))
          value['state'] = os.environ['STATE']
          value['published'] = True
          value['completed'] = False
          value.setdefault('distTags', {})[os.environ['TAG']] = os.environ['VALUE']
          json.dump(value, open(path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(path, 'a', encoding='utf-8').write('\n')
          PY
          }
          promote() {
            local tag="$1"
            local current
            local tag_error="$RUNNER_TEMP/skill-release-dist-tag-${tag}.err"
            if ! current="$(npm view "$PACKAGE_NAME" "dist-tags.$tag" --json 2>"$tag_error")"; then
              if grep -Eiq 'E404|404|not found|no dist-tag' "$tag_error"; then
                current=
              else
                echo "cannot read npm dist-tag: $tag" >&2
                cat "$tag_error" >&2
                exit 1
              fi
            fi
            action="$(python3 tools/skill-release/release.py dist-tag-policy --current "$current" --target "$VERSION")"
            if [ "$action" = promote ]; then
              npm dist-tag add "$PACKAGE_NAME@$VERSION" "$tag"
            elif [ "$action" != keep ]; then
              echo "unsupported dist-tag action: $action" >&2
              exit 1
            fi
            if ! current="$(npm view "$PACKAGE_NAME" "dist-tags.$tag" --json 2>"$tag_error")"; then
              echo "cannot read npm dist-tag after promotion: $tag" >&2
              cat "$tag_error" >&2
              exit 1
            fi
            test "$current" = "\"$VERSION\""
            update_tag_receipt "$tag" "$VERSION" "promotion-$tag"
          }
          promote "$COMPATIBILITY_LINE"
          promote latest
          if [ "${{ inputs.stable }}" = true ]; then
            promote stable
          fi
          python3 - "$receipt" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          value = json.load(open(path, encoding='utf-8'))
          value['state'] = 'completed'
          value['published'] = True
          value['completed'] = True
          json.dump(value, open(path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          open(path, 'a', encoding='utf-8').write('\n')
          PY
      - name: Upload release receipt
        if: always() && (needs.verify.outputs.decision == 'release:skill' || needs.verify.outputs.decision == 'release:skill-initial-publication')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-release-receipt-${{ inputs.merge_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-release-receipt.json
          if-no-files-found: ignore
          retention-days: 30
