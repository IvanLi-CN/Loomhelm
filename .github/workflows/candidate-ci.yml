name: Candidate CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      run_macos_product_package:
        description: Run the optional macOS Product Package check
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: loomhelm-pr-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository quality gates
        run: python3 .agents/skills/quality-gates/assets/scripts/check_quality_gates.py --repo-root . --allow-unchecked-branch-protection
      - name: Prepare pinned Markdown tools
        run: python3 tools/markdown.py setup
      - name: Verify candidate workflow failure propagation
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Run quality and deployment checks
        run: scripts/checks quality

  bootstrap-verification:
    name: Bootstrap Verification
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install verified sqlc
        run: |
          scripts/install-sqlc "$RUNNER_TEMP/loomhelm-bin"
          echo "SQLC_BIN=$RUNNER_TEMP/loomhelm-bin/sqlc" >> "$GITHUB_ENV"
      - name: Run canonical bootstrap
        run: scripts/checks bootstrap

  react-doctor:
    name: React Doctor
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install Web tooling
        run: bun install --frozen-lockfile
      - name: Check changed React files
        env:
          REACT_DOCTOR_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: scripts/check-react-doctor

  repository-verification:
    name: Repository Verification
    needs: quality-gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loomhelm
          POSTGRES_USER: loomhelm
          POSTGRES_PASSWORD: loomhelm_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomhelm -d loomhelm"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 100
    env:
      LOOMHELM_DATABASE_URL: postgres://loomhelm:loomhelm_ci_only@127.0.0.1:5432/loomhelm?sslmode=disable
      LOOMHELM_POSTGRES_PORT: "5432"
      LOOMHELM_DRAIN_TOKEN: loomhelm-ci-drain-token
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: repository
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Check Go source
        run: scripts/checks source
      - name: Save bounded Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: repository
          operation: save

  go-race-tests:
    name: Go Race Tests
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: repository
      - name: Run Go race tests
        run: scripts/checks source-race

  go-shuffle-tests:
    name: Go Shuffle Tests
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: repository
      - name: Run Go shuffled tests
        run: scripts/checks source-shuffle

  repository-contracts:
    name: Repository Contracts
    needs: quality-gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loomhelm
          POSTGRES_USER: loomhelm
          POSTGRES_PASSWORD: loomhelm_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomhelm -d loomhelm"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 100
    env:
      LOOMHELM_DATABASE_URL: postgres://loomhelm:loomhelm_ci_only@127.0.0.1:5432/loomhelm?sslmode=disable
      LOOMHELM_POSTGRES_PORT: "5432"
      LOOMHELM_DRAIN_TOKEN: loomhelm-ci-drain-token
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: repository
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install verified sqlc
        run: |
          scripts/install-sqlc "$RUNNER_TEMP/loomhelm-bin"
          echo "SQLC_BIN=$RUNNER_TEMP/loomhelm-bin/sqlc" >> "$GITHUB_ENV"
      - name: Check generated state
        run: scripts/checks generated
      - name: Check real database and jobs
        run: scripts/checks database
      - name: Check Web source
        run: scripts/checks web

  typescript-client-bun:
    name: TypeScript Client (Bun)
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.4
      - name: Prepare trusted Bun executable for sensitive launchers
        run: |
          bun_source=$(bun -e 'console.log(process.execPath)')
          sudo install -d -m 755 /usr/local/lib/loomhelm/runtime
          sudo install -m 755 "$bun_source" /usr/local/lib/loomhelm/runtime/bun
      - name: Verify source-only client and Skills
        run: scripts/checks client

  skills-native-macos:
    name: Skills Native macOS
    needs: quality-gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.4
      - name: Verify Bun FFI without project native compilation
        run: |
          export TMPDIR="$PWD/.tmp/ffi/tmp" HOME="$PWD/.tmp/ffi/home" BUN_INSTALL_CACHE_DIR="$PWD/.tmp/ffi/cache" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0
          mkdir -p "$TMPDIR" "$HOME" "$BUN_INSTALL_CACHE_DIR"
          bun install --cwd skills --frozen-lockfile --ignore-scripts --backend=copy
          bun skills/multi-task-flow-runtime/scripts/test-skills-native.ts
          bun test ./skills/bin/native-tests/core ./skills/bin/native-tests/visual

      - name: Verify multi-task-flow contracts on macOS
        run: |
          bun install --cwd skills/multi-task-flow-runtime --frozen-lockfile --ignore-scripts --backend=copy
          bun run --cwd skills/multi-task-flow-runtime test

      - name: Verify isolated viewer label upgrade
        timeout-minutes: 8
        run: |
          export LOOMHELM_SERVICE_BUNDLE_BUILD=1
          bun install --cwd skills/multi-task-flow-runtime --frozen-lockfile --ignore-scripts --backend=copy
          bun run --cwd skills/multi-task-flow-runtime build
          bun skills/multi-task-flow-runtime/scripts/build-service.ts --output "$RUNNER_TEMP/viewer-label-before" --service-version 0.0.0-ci
          bun skills/multi-task-flow-runtime/scripts/build-service.ts --output "$RUNNER_TEMP/viewer-label-after" --service-version 0.0.1-ci
          LOOMHELM_VIEWER_LABEL_BEFORE="$RUNNER_TEMP/viewer-label-before" LOOMHELM_VIEWER_LABEL_AFTER="$RUNNER_TEMP/viewer-label-after" bun test ./skills/multi-task-flow-runtime/tests/service-contract.test.ts

  candidate-producer:
    name: Candidate Producer
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: candidate
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Build immutable candidate
        run: scripts/build-candidate --source-sha "$CANDIDATE_SOURCE_SHA" --output "$RUNNER_TEMP/loomhelm-candidate"
      - name: Compile Windows Connector and application
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o "$RUNNER_TEMP/loomhelm-connector-windows.exe" ./cmd/connector
          go test -c -o "$RUNNER_TEMP/loomhelm-app-windows.test.exe" ./internal/app
      - name: Validate and expose candidate identity
        id: candidate
        run: |
          manifest="$RUNNER_TEMP/loomhelm-candidate/candidate-manifest.json"
          candidate_digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["digest"])' "$manifest")
          source_sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["source_sha"])' "$manifest")
          scripts/promote-candidate --manifest "$manifest" --destination "$RUNNER_TEMP/loomhelm-promotion-check" --expected-digest "$candidate_digest" --expected-source-sha "$source_sha" --dry-run
          echo "candidate_digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loomhelm-candidate-${{ steps.candidate.outputs.source_sha }}-${{ steps.candidate.outputs.candidate_digest }}
          path: ${{ runner.temp }}/loomhelm-candidate
          if-no-files-found: error
          retention-days: 90
      - name: Save bounded Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: candidate
          operation: save

  candidate-build:
    name: Candidate Build
    needs: [quality-gates, bootstrap-verification, react-doctor, repository-verification, repository-contracts, typescript-client-bun, candidate-producer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every candidate dependency to succeed
        env:
          CANDIDATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          expected = {"quality-gates", "bootstrap-verification", "react-doctor", "repository-verification", "repository-contracts", "typescript-client-bun", "candidate-producer"}
          results = json.loads(os.environ["CANDIDATE_RESULTS"])
          if set(results) != expected or any(value.get("result") != "success" for value in results.values()):
              raise SystemExit("candidate dependencies incomplete or unsuccessful")
          PYTHON

  candidate-reproducibility:
    name: Candidate Reproducibility
    continue-on-error: true
    needs: candidate-producer
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        uses: ./.github/actions/go-cache
        with:
          purpose: candidate
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Rebuild and compare candidate identity
        run: scripts/reproduce-candidate --source-sha "$CANDIDATE_SOURCE_SHA" --output "$RUNNER_TEMP/loomhelm-candidate-repro"

  product-release-contract:
    name: Product Release Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
      - name: Audit existing main protection without release writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/product-release audit
      - name: Verify version policy, real Git CAS and publication recovery
        run: |
          scripts/product-release check
          python3 -m unittest discover -s tools/release -p 'test_*.py'

  product-package-smoke:
    name: Product Package (${{ matrix.runner }})
    needs: candidate-producer
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore explicit Go caches
        if: runner.os == 'Linux'
        uses: ./.github/actions/go-cache
        with:
          purpose: candidate
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.4
      - name: Prepare fixture record at exact Candidate SHA
        run: python3 tools/release/fixture_record.py > "$RUNNER_TEMP/record.json"
      - name: Prepare offline image importer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Build and observe native package partitions
        run: |
          part=server
          python3 tools/release/build_part.py --record "$RUNNER_TEMP/record.json" --part "$part" --output "$RUNNER_TEMP/core-product"
          python3 tools/release/smoke.py --record "$RUNNER_TEMP/record.json" --directory "$RUNNER_TEMP/core-product"
          python3 tools/release/build_part.py --record "$RUNNER_TEMP/record.json" --part ts-client --output "$RUNNER_TEMP/ts-product"
          python3 tools/release/smoke.py --record "$RUNNER_TEMP/record.json" --directory "$RUNNER_TEMP/ts-product"

  product-package-macos:
    name: Product Package (macos-15)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos_product_package == true }}
    needs: candidate-producer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.4
      - name: Prepare fixture record at exact Candidate SHA
        run: python3 tools/release/fixture_record.py > "$RUNNER_TEMP/record.json"
      - name: Build and observe native package partitions
        run: |
          python3 tools/release/build_part.py --record "$RUNNER_TEMP/record.json" --part go-client --output "$RUNNER_TEMP/core-product"
          python3 tools/release/smoke.py --record "$RUNNER_TEMP/record.json" --directory "$RUNNER_TEMP/core-product"
          python3 tools/release/build_part.py --record "$RUNNER_TEMP/record.json" --part ts-client --output "$RUNNER_TEMP/ts-product"
          python3 tools/release/smoke.py --record "$RUNNER_TEMP/record.json" --directory "$RUNNER_TEMP/ts-product"
