name: Candidate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loomhelm-pr-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository quality gates
        run: python3 .agents/skills/quality-gates/assets/scripts/check_quality_gates.py --repo-root . --allow-unchecked-branch-protection
      - name: Prepare pinned Markdown tools
        run: python3 tools/markdown.py setup
      - name: Run quality and deployment checks
        run: scripts/checks quality

  bootstrap-verification:
    name: Bootstrap Verification
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install verified sqlc
        run: |
          scripts/install-sqlc "$RUNNER_TEMP/loomhelm-bin"
          echo "SQLC_BIN=$RUNNER_TEMP/loomhelm-bin/sqlc" >> "$GITHUB_ENV"
      - name: Run canonical bootstrap
        run: scripts/checks bootstrap

  react-doctor:
    name: React Doctor
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install Web tooling
        run: bun install --frozen-lockfile
      - name: Check changed React files
        env:
          REACT_DOCTOR_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: scripts/check-react-doctor

  repository-verification:
    name: Repository Verification
    needs: [quality-gates, bootstrap-verification]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: loomhelm
          POSTGRES_USER: loomhelm
          POSTGRES_PASSWORD: loomhelm_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loomhelm -d loomhelm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOOMHELM_DATABASE_URL: postgres://loomhelm:loomhelm_ci_only@127.0.0.1:5432/loomhelm?sslmode=disable
      LOOMHELM_POSTGRES_PORT: "5432"
      LOOMHELM_DRAIN_TOKEN: loomhelm-ci-drain-token
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Install verified sqlc
        run: |
          scripts/install-sqlc "$RUNNER_TEMP/loomhelm-bin"
          echo "SQLC_BIN=$RUNNER_TEMP/loomhelm-bin/sqlc" >> "$GITHUB_ENV"
      - name: Check generated state
        run: scripts/checks generated
      - name: Check Go source
        run: scripts/checks source
      - name: Check real database and jobs
        run: scripts/checks database
      - name: Check Web source
        run: scripts/checks web

  candidate-build:
    name: Candidate Build
    needs: [quality-gates, bootstrap-verification, react-doctor, repository-verification]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Build immutable candidate
        run: scripts/build-candidate --source-sha "$CANDIDATE_SOURCE_SHA" --output "$RUNNER_TEMP/loomhelm-candidate"
      - name: Validate and expose candidate identity
        id: candidate
        run: |
          manifest="$RUNNER_TEMP/loomhelm-candidate/candidate-manifest.json"
          candidate_digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["digest"])' "$manifest")
          source_sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["source_sha"])' "$manifest")
          scripts/promote-candidate --manifest "$manifest" --destination "$RUNNER_TEMP/loomhelm-promotion-check" --expected-digest "$candidate_digest" --expected-source-sha "$source_sha" --dry-run
          echo "candidate_digest=$candidate_digest" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loomhelm-candidate-${{ steps.candidate.outputs.source_sha }}-${{ steps.candidate.outputs.candidate_digest }}
          path: ${{ runner.temp }}/loomhelm-candidate
          if-no-files-found: error
          retention-days: 90

  candidate-reproducibility:
    name: Candidate Reproducibility
    continue-on-error: true
    needs: quality-gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Rebuild and compare candidate identity
        run: scripts/reproduce-candidate --source-sha "$CANDIDATE_SOURCE_SHA" --output "$RUNNER_TEMP/loomhelm-candidate-repro"
