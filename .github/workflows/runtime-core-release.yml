name: Runtime Core Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit containing the runtime-core package to release
        required: true
        type: string
      version:
        description: Exact runtime-core package version to publish
        required: true
        type: string
      publish:
        description: Publish the verified package through npm Trusted Publishing
        required: true
        default: false
        type: boolean
      finalize_run_id:
        description: Original upload run to finalize without rebuilding or republishing
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: loomhelm-runtime-core-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify runtime-core candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun 1.4.4
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Validate package identity and exact version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          FINALIZE_RUN_ID: ${{ inputs.finalize_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import json, os, re
          package = json.load(open('packages/runtime-core/package.json', encoding='utf-8'))
          version = os.environ['VERSION']
          if package.get('name') != '@loomhelm/runtime-core':
              raise SystemExit('runtime-core package name mismatch')
          if package.get('version') != version or not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', version):
              raise SystemExit('runtime-core package version mismatch or invalid SemVer')
          if package.get('private') is True:
              raise SystemExit('runtime-core release package must be publishable')
          repository = package.get('repository') or {}
          expected_url = f"git+https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          if not isinstance(repository, dict) or repository.get('type') != 'git' or repository.get('url') != expected_url or repository.get('directory') != 'packages/runtime-core':
              raise SystemExit('runtime-core repository metadata must match GitHub provenance')
          finalize_run_id = os.environ['FINALIZE_RUN_ID']
          if finalize_run_id and (not re.fullmatch(r'[1-9]\d*', finalize_run_id) or os.environ['PUBLISH'] != 'true'):
              raise SystemExit('finalize_run_id requires a positive run ID and publish=true')
          PY
      - name: Verify exact npm version is unpublished
        if: inputs.publish == true && inputs.finalize_run_id == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if npm view "@loomhelm/runtime-core@$VERSION" version --json >/dev/null 2>"$RUNNER_TEMP/runtime-core-npm.err"; then
            echo "runtime-core@$VERSION already exists; refusing to republish" >&2
            exit 1
          fi
          grep -Eq 'E404|No match found' "$RUNNER_TEMP/runtime-core-npm.err"
      - name: Build and freeze candidate tarball
        if: inputs.finalize_run_id == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-core-candidate"
          (cd packages/runtime-core && npm pack --json --pack-destination "$RUNNER_TEMP/runtime-core-candidate" > "$RUNNER_TEMP/runtime-core-pack.json")
          tarball="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["filename"])' "$RUNNER_TEMP/runtime-core-pack.json")"
          test "$(basename "$tarball")" = "loomhelm-runtime-core-$VERSION.tgz"
          sha256sum "$RUNNER_TEMP/runtime-core-candidate/$tarball" > "$RUNNER_TEMP/runtime-core-candidate/SHA256SUMS"
          cp "$RUNNER_TEMP/runtime-core-candidate/$tarball" "$RUNNER_TEMP/runtime-core.tgz"
      - name: Validate original upload run identity
        if: inputs.finalize_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FINALIZE_RUN_ID: ${{ inputs.finalize_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FINALIZE_RUN_ID" > "$RUNNER_TEMP/original-run.json"
          python3 - <<'PY'
          import json, os
          run = json.load(open(os.environ['RUNNER_TEMP'] + '/original-run.json', encoding='utf-8'))
          if run.get('head_sha') != os.environ['SOURCE_SHA'] or run.get('path') != '.github/workflows/runtime-core-release.yml' or run.get('event') != 'workflow_dispatch':
              raise SystemExit('original upload run does not match the exact source and release workflow')
          PY
      - name: Download original frozen candidate
        if: inputs.finalize_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-core-candidate-${{ inputs.version }}
          run-id: ${{ inputs.finalize_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Verify original frozen candidate checksum
        if: inputs.finalize_run_id != ''
        run: |
          set -euo pipefail
          expected="$(awk 'NR==1 {print $1}' "$RUNNER_TEMP/runtime-core-candidate/SHA256SUMS")"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/runtime-core.tgz" | sha256sum --check -
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-core-candidate-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/runtime-core.tgz
            ${{ runner.temp }}/runtime-core-candidate/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish runtime-core package
    needs: verify
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js and npm Trusted Publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm Trusted Publishing client
        run: npm install --global npm@11.21.0
      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: runtime-core-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/runtime-core-candidate
      - name: Publish exact frozen tarball
        if: inputs.finalize_run_id == ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tarball="$(find "$RUNNER_TEMP/runtime-core-candidate" -maxdepth 1 -name 'runtime-core.tgz' -type f -print -quit)"
          test -n "$tarball"
          npm publish "$tarball" --access public --provenance --tag latest
      - name: Wait for exact package and verify frozen integrity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, time, urllib.error, urllib.request
          version = os.environ['VERSION']
          tarball = open(os.environ['RUNNER_TEMP'] + '/runtime-core-candidate/runtime-core.tgz', 'rb').read()
          expected = 'sha512-' + base64.b64encode(hashlib.sha512(tarball).digest()).decode()
          url = 'https://registry.npmjs.org/@loomhelm%2Fruntime-core/' + version
          deadline = time.monotonic() + 900
          while True:
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      package = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404 or time.monotonic() >= deadline:
                      raise
                  print(f'runtime-core@{version} processing; waiting for registry visibility', flush=True)
                  time.sleep(10)
          if package.get('name') != '@loomhelm/runtime-core' or package.get('version') != version or package.get('dist', {}).get('integrity') != expected:
              raise SystemExit('published runtime-core identity or frozen tarball integrity mismatch')
          print(f'runtime-core@{version}: exact identity and frozen integrity verified')
          PY
      - name: Promote and verify dist-tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm dist-tag add "@loomhelm/runtime-core@$VERSION" compat-v1
          test "$(npm view @loomhelm/runtime-core@compat-v1 version)" = "$VERSION"
          test "$(npm view @loomhelm/runtime-core@latest version)" = "$VERSION"
      - name: Create immutable runtime-core tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="runtime-core-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')" = "$SOURCE_SHA"
          else
            git tag -a "$tag" "$SOURCE_SHA" -m "Release @loomhelm/runtime-core@$VERSION"
            git push origin "$tag"
          fi
