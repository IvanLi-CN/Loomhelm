name: Blue-Green Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the deterministic contract checks; runtime rehearsal is reserved for Agent VM.
        required: true
        default: control-only
        type: choice
        options:
          - control-only
  pull_request:
    paths:
      - deploy/preview/**
      - scripts/preview
      - scripts/rehearse-blue-green
      - .github/workflows/blue-green-baseline.yml
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: loomhelm-blue-green-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-contract:
    name: Blue-Green Control Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run deterministic rehearsal
        run: |
          evidence="$RUNNER_TEMP/loomhelm-blue-green"
          scripts/rehearse-blue-green --control-only --evidence-dir "$evidence"
      - name: Upload rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loomhelm-blue-green-control-${{ github.run_id }}
          path: ${{ runner.temp }}/loomhelm-blue-green
          if-no-files-found: error
          retention-days: 30
