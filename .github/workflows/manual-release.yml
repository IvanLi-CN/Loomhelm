name: Manual Release
on:
  workflow_dispatch:
    inputs:
      release_target:
        description: patch, minor, major or an explicit final/prerelease version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: loomhelm-manual-release
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: write
      pull-requests: read
      checks: read
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require protected main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve owner intent
        env:
          TARGET: ${{ inputs.release_target }}
        run: |
          scripts/product-release reserve --target "$TARGET" --source-sha "$GITHUB_SHA" > "$RUNNER_TEMP/identity.json"
      - name: Prepare version branch for the normal owner PR
        run: |
          identity=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/identity.json"))["id"])')
          scripts/product-release prepare --identity "$identity"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-identity
          path: ${{ runner.temp }}/identity.json
          if-no-files-found: ignore
