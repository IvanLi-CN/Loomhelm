name: Release Failure Notification
on:
  workflow_run:
    workflows: [Manual Release, Release]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: loomhelm-release-failure-sidecar
  cancel-in-progress: false
jobs:
  notify:
    permissions:
      contents: write
      issues: write
      actions: read
    if: github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted default-branch notifier only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Read failure identity as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: release-identity
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/failed-release-record
      - name: Reconcile Issue notification
        run: python3 tools/release/notify_failure.py
